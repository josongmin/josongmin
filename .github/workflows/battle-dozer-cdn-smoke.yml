name: Battle Dozer — HTTPS Mobile Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'games/battle-dozer/**'
      - '.github/workflows/battle-dozer-cdn-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify HTTPS HTML on third-party CDN
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githack.com/josongmin/josongmin/${GITHUB_SHA}/games/battle-dozer/index.html"
          for i in {1..10}; do
            code=$(curl -L -sS -o /tmp/bd.html -w "%{http_code}" --max-time 20 "$url" || true)
            if [[ "$code" == "200" ]] && grep -q 'BATTLE DOZER' /tmp/bd.html; then break; fi
            echo "Attempt $i: HTTP $code"
            sleep 4
          done
          test -s /tmp/bd.html
          grep -q 'BATTLE DOZER' /tmp/bd.html
          grep -q '__battleDozerDebug' /tmp/bd.html
          grep -q 'function laneOfX(x){return x>1.45?0:x<-1.45?2:1}' /tmp/bd.html
          curl -LsS -D /tmp/bd-headers.txt -o /tmp/bd.html "$url"
          grep -i -E 'HTTP/|content-type' /tmp/bd-headers.txt | tail -5
          grep -qi 'content-type: text/html' /tmp/bd-headers.txt
      - name: Install Playwright
        shell: bash
        run: |
          npm --version
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright --version
      - name: Browser smoke test (mobile + fallback)
        shell: bash
        run: |
          node <<'JS'
          const {chromium,webkit}=require('playwright');
          (async()=>{
            for(const [engine,launcher] of [['chromium',chromium],['webkit',webkit]]){
            const browser=await launcher.launch({headless:true});
            try{
              const url='https://raw.githack.com/josongmin/josongmin/'+process.env.GITHUB_SHA+'/games/battle-dozer/index.html';
              for(const lite of [false,true]){
                const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
                const errors=[];
                page.on('pageerror',e=>errors.push(String(e)));
                const response=await page.goto(url+(lite?'?lite=1':''),{waitUntil:'domcontentloaded',timeout:60000});
                const locator=page.locator('#start');
                console.log('NAV_DIAGNOSTIC',JSON.stringify({lite,status:response?.status(),url:page.url(),title:await page.title(),startCount:await locator.count(),bodyStart:(await page.locator('body').innerText().catch(e=>'BODY_ERROR:'+e)).slice(0,250)}));
                if(await locator.count()===0){
                  const open=page.getByText('Open the page',{exact:true}).first();
                  console.log('CONSENT',JSON.stringify({lite,openCount:await open.count()}));
                  if(await open.count())await open.click({timeout:15000});
                  await page.waitForTimeout(900);
                }
                console.log('POST_CONSENT',JSON.stringify({lite,url:page.url(),startCount:await locator.count(),title:await page.title()}));
                if(await locator.count()===0)throw new Error('Missing Start button after content notice');
                await locator.click({timeout:15000});
                await page.waitForTimeout(1800);
                const before=await page.evaluate(()=>({mode:window.__battleDozerDebug?.state?.mode,drops:window.__battleDozerDebug?.state?.drops||window.__battleDozerDebug?.state?.coinsDropped||0,coins:window.__battleDozerDebug?.coins?.length,world3d:window.__battleDozerDebug?.metrics()?.world3d}));
                await page.locator('#gl').tap({position:{x:180,y:440}});
                await page.waitForTimeout(500);
                const after=await page.evaluate(()=>({mode:window.__battleDozerDebug?.state?.mode,drops:window.__battleDozerDebug?.state?.drops||window.__battleDozerDebug?.state?.coinsDropped||0,coins:window.__battleDozerDebug?.coins?.length,world3d:window.__battleDozerDebug?.metrics()?.world3d}));
                console.log('SMOKE',JSON.stringify({engine,lite,before,after,errors}));
                if(after.mode!=='playing'||!after.coins||errors.length)throw new Error('Mobile game failed: '+JSON.stringify({lite,after,errors}));
                const gameplay=await page.evaluate(()=>{
                  const d=window.__battleDozerDebug,s=d.state;
                  s.warning=0;s.bossStun=0;s.enemyTimer=.01;
                  d.step(.05);
                  const began=s.warning>0&&s.threatLane>=0;
                  const lane=s.threatLane,need=s.threatNeed;
                  s.aimX=[3,0,-3][lane];s.ammo=Math.max(15,s.ammo);
                  for(let i=0;i<need;i++)d.drop();
                  const parried=s.parries>=1&&s.bossStun>0&&s.warning===0;
                  s.combo=s.feverThreshold-1;s.comboT=s.time;s.fever=0;s.feverCooldown=0;
                  d.collect({kind:'normal',x:0,releaseHeight:.20});
                  const fever=s.fever>0&&s.feverTimes>0;
                  s.bossStun=0;s.enemyTimer=.01;d.step(.05);
                  s.wall=6;s.warning=.015;
                  const priorHp=s.hp;d.step(.03);
                  const shieldBlocked=s.hp===priorHp;
                  s.enemy=5;d.deal(10);
                  const upgrade=s.mode==='upgrade';
                  if(upgrade)document.querySelector('[data-choose]').click();
                  const nextWave=s.wave===1&&s.mode==='playing';
                  return {began,lane,need,parried,parries:s.parries,fever,feverTimes:s.feverTimes,shieldBlocked,upgrade,nextWave,render:d.metrics().world3d};
                });
                console.log('GAMEPLAY',JSON.stringify({engine,lite,gameplay}));
                if(!gameplay.began||!gameplay.parried||!gameplay.fever||!gameplay.shieldBlocked||!gameplay.upgrade||!gameplay.nextWave)
                  throw new Error('Gameplay test failed: '+JSON.stringify({engine,lite,gameplay}));
                if(!lite)await page.locator('#view').click();
                await page.waitForTimeout(lite?100:1100);
                await page.locator('#gl').tap({position:{x:240,y:400}});
                const aiming=await page.evaluate(()=>{
                  const d=window.__battleDozerDebug,s=d.state;
                  const zz=d.worldZ(Math.max(3.95,s.pusher+1.2));
                  const projected=d.projectPoint(s.aimX,.18,zz);
                  return {x:s.aimX,screenX:projected.x,atInput:s.lastAimDisplayX,expectX:240,error:Math.abs(s.lastAimDisplayX-240)};
                });
                console.log('AIM',JSON.stringify({engine,lite,aiming}));
                if(aiming.error>9)throw new Error('Camera-aware aiming failed: '+JSON.stringify({engine,lite,aiming}));
                const fullRun=await page.evaluate(()=>{
                  const d=window.__battleDozerDebug,s=d.state;
                  s.enemy=2;d.deal(20);
                  const secondUpgrade=s.mode==='upgrade'&&s.wave===1;
                  if(secondUpgrade)document.querySelector('[data-choose]').click();
                  const reachedBoss=s.wave===2&&s.mode==='playing';
                  if(reachedBoss){s.enemy=2;d.deal(20);}
                  return {secondUpgrade,reachedBoss,victory:s.mode==='victory'};
                });
                console.log('FULL_RUN',JSON.stringify({engine,lite,fullRun}));
                if(!fullRun.secondUpgrade||!fullRun.reachedBoss||!fullRun.victory)
                  throw new Error('3-wave campaign failed: '+JSON.stringify({engine,lite,fullRun}));
                await page.close();
              }
            }finally{await browser.close()}
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
