name: Battle Dozer Mobile — GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: battle-dozer-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          test -s games/battle-dozer/index.html
          mkdir -p _site/battle-dozer
          cp games/battle-dozer/index.html _site/battle-dozer/index.html
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./battle-dozer/"><title>Battle Dozer</title><p><a href="./battle-dozer/">Play Battle Dozer</a></p></html>
          HTML
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
