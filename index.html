<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PLUMFALL · 매화전기 | 3D</title><style>html,body{margin:0;min-height:100%;background:#090b13;color:#f5e5cd;font-family:system-ui,sans-serif}main{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:18px;background:radial-gradient(circle at 50% 35%,#30263d,#090b13 75%)}h1{font-size:clamp(32px,6vw,60px);margin:0;letter-spacing:.12em}p{color:#d0c1b2;margin:0}progress{width:min(75vw,320px);accent-color:#e5b980}a{color:#e9c28c}button{background:#e5b980;color:#17121d;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}</style></head><body><main id="loading"><h1>PLUMFALL</h1><p id="status">3D 게임 데이터를 불러오는 중…</p><progress id="progress" max="20" value="0"></progress><p><a href="light.html">경량 호환판 플레이</a></p></main><script>(async()=>{const status=document.getElementById('status'),bar=document.getElementById('progress');try{const files=Array.from({length:20},(_,i)=>'parts/p'+String(i).padStart(2,'0')+'.txt');let loaded=0;const chunks=await Promise.all(files.map(async path=>{const res=await fetch(path);if(!res.ok)throw new Error(path+' ('+res.status+')');const txt=await res.text();bar.value=++loaded;status.textContent='3D 게임 불러오는 중… '+loaded+'/20';return txt;}));const html=chunks.join('');if(!html.startsWith('<!doctype html>')||!html.includes('</html>'))throw new Error('게임 데이터가 완전하지 않습니다');document.open();document.write(html);document.close();}catch(e){status.textContent='3D 로딩 실패: '+e.message;bar.style.display='none';const p=document.createElement('p');p.innerHTML='<a href="light.html">경량 호환판으로 플레이하기</a>';document.getElementById('loading').append(p);console.error(e)}})();</script></body></html>
